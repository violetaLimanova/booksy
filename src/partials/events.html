<section class="events" id="events">
  <div class="container">
    <div class="events-heading">
      <p class="events-eyebrow">Events</p>
      <h2 class="events-title">Upcoming Events at Booksy</h2>
      <p class="events-description">
        Discover readings, workshops, and bookish gatherings — online and
        offline. Everyone’s welcome.
      </p>
    </div>

    <div class="swiper events-slider">
      <ul class="swiper-wrapper events-list"></ul>
    </div>

    <div class="events-controls">
      <div class="events-pagination"></div>

      <div class="events-navigation">
        <button
          class="events-button-prev"
          type="button"
          aria-label="Previous slide"
        >
          <svg
            class="events-arrow-icon"
            width="24"
            height="24"
            aria-hidden="true"
          >
            <use href="/symbol-defs.svg#left-arrow-alt"></use>
          </svg>
        </button>

        <button
          class="events-button-next"
          type="button"
          aria-label="Next slide"
        >
          <svg
            class="events-arrow-icon"
            width="24"
            height="24"
            aria-hidden="true"
          >
            <use href="/symbol-defs.svg#right-arrow-alt"></use>
          </svg>
        </button>
      </div>
    </div>
  </div>
</section>
