<section id="hero">
  <div class="container">
    <div class="swiper">
      <!-- Additional required wrapper -->
      <ul class="swiper-wrapper hero-banner-list">
        <!-- Slides -->

        <li class="swiper-slide hero-banner-item">
          <picture>
            <!-- Desktop -->
            <source
              media="(min-width: 1440px)"
              srcset="/hero-desk-1-@x1.avif 1x, /hero-desk-1-@x2.avif 2x"
            />

            <!-- Tablet -->
            <source
              media="(min-width: 768px)"
              srcset="/hero-tab-1-@x1.avif 1x, /hero-tab-1-@x2.avif 2x"
            />

            <!-- Mobile -->
            <img
              class="hero-banner-img"
              src="/hero-mob-1-@x1.avif"
              srcset="/hero-mob-1-@x1.avif 1x, /hero-mob-1-@x2.avif 2x"
              alt="Open book and a cup of coffee next to a knitted blanket"
            />
          </picture>

          <div class="hero-banner-content">
            <h2 class="hero-banner-title">Get 10% off your first&nbsp;order</h2>
            <a class="hero-banner-shop" href="#books">Shop Now!</a>
          </div>
        </li>

        <li class="swiper-slide hero-banner-item">
          <picture>
            <!-- Desktop -->
            <source
              media="(min-width: 1440px)"
              srcset="/hero-desk-2-@x1.avif 1x, /hero-desk-2-@x2.avif 2x"
            />

            <!-- Tablet -->
            <source
              media="(min-width: 768px)"
              srcset="/hero-tab-2-@x1.avif 1x, /hero-tab-2-@x2.avif 2x"
            />

            <!-- Mobile -->
            <img
              class="hero-banner-img"
              src="/hero-mob-2-@x1.avif"
              srcset="/hero-mob-2-@x1.avif 1x, /hero-mob-2-@x2.avif 2x"
              alt="Open book and eyeglasses on a table"
            />
          </picture>

          <div class="hero-banner-content">
            <h2 class="hero-banner-title">Save 15% on some&nbsp;books</h2>
            <a class="hero-banner-shop" href="#books">Shop Now!</a>
          </div>
        </li>

        <li class="swiper-slide hero-banner-item">
          <picture>
            <!-- Desktop -->
            <source
              media="(min-width: 1440px)"
              srcset="/hero-desk-3-@x1.avif 1x, /hero-desk-3-@x2.avif 2x"
            />

            <!-- Tablet -->
            <source
              media="(min-width: 768px)"
              srcset="/hero-tab-3-@x1.avif 1x, /hero-tab-3-@x2.avif 2x"
            />

            <!-- Mobile -->
            <img
              class="hero-banner-img"
              src="/hero-mob-3-@x1.avif"
              srcset="/hero-mob-3-@x1.avif 1x, /hero-mob-3-@x2.avif 2x"
              alt="Books arranged on wooden bookshelves"
            />
          </picture>

          <div class="hero-banner-content">
            <h2 class="hero-banner-title">
              Summer Sale! Up&nbsp;to&nbsp;-40%&nbsp;discounts
            </h2>
            <a class="hero-banner-shop" href="#books">Shop Now!</a>
          </div>
        </li>

        <li class="swiper-slide hero-banner-item">
          <picture>
            <!-- Desktop -->
            <source
              media="(min-width: 1440px)"
              srcset="/hero-desk-4-@x1.avif 1x, /hero-desk-4-@x2.avif 2x"
            />

            <!-- Tablet -->
            <source
              media="(min-width: 768px)"
              srcset="/hero-tab-4-@x1.avif 1x, /hero-tab-4-@x2.avif 2x"
            />

            <!-- Mobile -->
            <img
              class="hero-banner-img"
              src="/hero-mob-4-@x1.avif"
              srcset="/hero-mob-4-@x1.avif 1x, /hero-mob-4-@x2.avif 2x"
              alt="Open book and a ceramic vase with dried flowers"
            />
          </picture>

          <div class="hero-banner-content">
            <h2 class="hero-banner-title">
              Last chance to buy our spring&nbsp;bestsellers
            </h2>
            <a class="hero-banner-shop" href="#books">Shop Now!</a>
          </div>
        </li>
      </ul>
    </div>

    <div class="hero-bottom">
      <!-- navigation buttons -->
      <div class="hero-btns-arrow">
        <button type="button" class="hero-button-prev hero-btn-arrow">
          <svg class="hero-arrow" width="24" height="24">
            <use href="/symbol-defs.svg#left-arrow-alt"></use>
          </svg>
        </button>
        <button type="button" class="hero-button-next hero-btn-arrow">
          <svg class="hero-arrow" width="24" height="24">
            <use href="/symbol-defs.svg#right-arrow-alt"></use>
          </svg>
        </button>
      </div>
      <h1 class="hero-title">Discover Your Next Great Read Today!</h1>
    </div>
  </div>
</section>
