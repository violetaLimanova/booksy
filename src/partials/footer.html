<footer class="footer" id="footer">
  <div class="footer-container">
    <div class="footer-content">
      <div class="footer-navigation">
        <a class="footer-logo" href="#home" aria-label="Booksy home">
          <svg
            width="84"
            height="36"
            viewBox="0 0 84 36"
            aria-hidden="true"
            focusable="false"
          >
            <use
              href="/symbol-defs.svg#logo"
              x="0.5"
              y="7.938"
              width="83"
              height="21"
            ></use>
          </svg>
        </a>

        <nav aria-label="Footer navigation">
          <ul class="footer-links">
            <li><a class="footer-link" href="#home">Home</a></li>
            <li><a class="footer-link" href="#books">Books</a></li>
            <li><a class="footer-link" href="#feedbacks">Feedback</a></li>
            <li><a class="footer-link" href="#location">Location</a></li>
          </ul>
        </nav>

      <form class="footer-form">
        <label class="footer-form-label" for="footer-email">Join</label>
        <div class="footer-form-fields">

            id="footer-email"
            type="email"
            name="email"
            autocomplete="email"
            placeholder="Enter your email"
            aria-label="Email address"
            aria-describedby="footer-email-hint"
            pattern="^\w+(\.\w+)?@[a-zA-Z_]+?\.[a-zA-Z]{2,3}$"

        </div>
