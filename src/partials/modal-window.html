<div class="contact-backdrop" data-modal>
  <div class="contact-modal">
    <button
      class="contact-modal__close"
      type="button"
      aria-label="Close"
      data-modal-close
    >
      <svg
        class="contact-modal__close-icon"
        width="32"
        height="32"
        aria-hidden="true"
      >
        <use href="/symbol-defs.svg#x"></use>
      </svg>
    </button>

    <h2 class="contact-modal__title">Register</h2>
    <p class="contact-modal__event" data-modal-event>
      Cozy Book Club — “The Midnight Library”
    </p>

    <form class="contact-modal__form" data-modal-form>
      <label class="contact-modal__field">
        <span class="contact-modal__label">Name*</span>
        <input
          class="contact-modal__input"
          type="text"
          name="name"
          placeholder="Ann"
          required
        />
      </label>

      <label class="contact-modal__field">
        <span class="contact-modal__label">Email*</span>
        <input
          class="contact-modal__input"
          type="email"
          name="email"
          placeholder="hello@booksy.com"
          required
        />
      </label>

      <label class="contact-modal__field">
        <span class="contact-modal__label">Message</span>
        <textarea
          class="contact-modal__input contact-modal__textarea"
          name="message"
          placeholder="Type your message..."
        ></textarea>
      </label>

      <button class="contact-modal__btn" type="submit">Register</button>
    </form>
  </div>
</div>
