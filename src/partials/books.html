<section class="books">
  <div class="container">
    <h2 class="is-hidden">Trending books</h2>
    <div class="books-top">
      <h3 class="books-subtitle">Books</h3>
      <p class="books-count">Showing 24 of 100</p>
    </div>

    <button type="button" class="books-dropdown-btn">Categories</button>
    <ul class="books-categories">
      <li class="books-category">
        <button type="button" class="books-category-btn is-active">
          All categories
        </button>
      </li>
      <li class="books-category">
        <button type="button" class="books-category-btn">
          Combined Print and E-book Fiction
        </button>
      </li>
      <li class="books-category">
        <button type="button" class="books-category-btn">
          Combined Print & E-book Nonfiction
        </button>
      </li>
      <li class="books-category">
        <button type="button" class="books-category-btn">
          Hardcover fiction
        </button>
      </li>
    </ul>

    <ul class="books-list">
      <li class="books-item">
        <img
          class="books-img"
          src="https://via.placeholder.com/150"
          alt="Book cover"
        />
        <div class="books-content">
          <div class="books-row">
            <h3 class="books-title">Book Title</h3>
            <p class="books-price">price</p>
          </div>
          <p class="books-author">Author Name</p>
          <button type="button" class="books-btn">Learn More</button>
        </div>
      </li>
    </ul>
    <button type="button" class="books-more-btn">Show More</button>
  </div>
</section>
